<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H8391001 庫存儀表板</title>
<style>
<style>
    #access-gate { position: fixed; inset: 0; z-index: 99999; background: #0f172a;
        display: none; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
        font-family: 'Segoe UI','Microsoft JhengHei',sans-serif; }
    .gate-box { background: #ffffff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        padding: 38px 32px; max-width: 420px; width: 100%; text-align: center; }
    .gate-box h2 { color: #0f172a; margin: 0 0 10px; font-size: 1.25rem; }
    .gate-box p { color: #64748b; font-size: 0.9rem; margin: 0 0 20px; line-height: 1.6; }
    .gate-box input { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
        font-size: 1rem; box-sizing: border-box; margin-bottom: 12px; color: #0f172a; }
    .gate-box input:focus { outline: none; border-color: #3b82f6; }
    .gate-box button { width: 100%; padding: 13px 14px; border: none; border-radius: 10px;
        background: #3b82f6; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .gate-box button:hover { background: #2563eb; }
    #gate-status { margin-top: 14px; font-size: 0.9rem; min-height: 1.2em; color: #475569; }
    </style>
    #dashFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; z-index: 1; background: #fff; }
</style>
</head>
<body>
<div id="access-gate">
      <div class="gate-box">
        <div style="font-size:40px;margin-bottom:10px;">&#128274;</div>
        <h2>H8391001 庫存儀表板</h2>
        <p>此 Dashboard 只供獲授權人士查閱。<br>請輸入你的 Email 申請訪問權限，管理員批准後即可進入。</p>
        <input type="email" id="gate-email" placeholder="你的 Email" autocomplete="email">
        <button id="gate-submit">申請訪問</button>
        <p id="gate-status"></p>
        <div style="font-size:11px;color:#94a3b8;margin-top:14px;">Admin: HKTVmall 商戶合規</div>
      </div>
    </div>
    <iframe id="dashFrame" title="H8391001 Dashboard"></iframe>
    <script>
    // 🔒 Access gate loader (B pilot 2026-08-29): gate → session → iframe (dashboard 由 worker auth serve)
    var ALLOWLIST_URL = 'data/access_allowlist.json';
    var GATE_ADMIN_EMAIL = 'jerry@hktv.com.hk';
    var GATE_STORE = 'H8391001';
    var DASH_URL = 'https://fificheck-access-gate.fificheck.workers.dev/data?site=' + GATE_STORE + '&path=index.html';

    async function enterDash(email) {
      var status = document.getElementById('gate-status');
      try {
        var r = await fetch('https://fificheck-access-gate.fificheck.workers.dev/session', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ site: GATE_STORE, email: email }),
          credentials: 'include'
        });
        if (!r.ok) { if (status) status.textContent = '⚠️ 未授權或 session 過期，請重新申請'; return; }
      } catch (e) { if (status) status.textContent = '⚠️ 連線失敗，請稍後再試'; return; }
      var f = document.getElementById('dashFrame');
      f.src = DASH_URL + '&v=' + Date.now();
      f.style.display = 'block';
    }

    async function initGate() {
      var gate = document.getElementById('access-gate');
      var status = document.getElementById('gate-status');
      if (!gate) return;
      var saved = null;
      try { saved = localStorage.getItem('h8391001-gate-email'); } catch(e) {}
      var list = [];
      try {
        var r = await fetch(ALLOWLIST_URL + '?v=' + Date.now());
        if (r.ok) list = await r.json();
      } catch (e) { /* offline — fall through to gate */ }
      var norm = list.map(String).map(function(s) { return s.trim().toLowerCase(); });
      if (saved && norm.indexOf(saved.toLowerCase()) >= 0) {
        gate.style.display = 'none';
        enterDash(saved);
        return;
      }
      gate.style.display = 'flex';
      var input = document.getElementById('gate-email');
      async function submitGateRequest() {
        var email = (input.value || '').trim();
        if (email.length < 1 || email.indexOf('@') < 1) { status.textContent = '⚠️ 請輸入有效 Email'; return; }
        status.textContent = '⏳ 送出申請中…';
        try {
          await fetch('https://fificheck-access-gate.fificheck.workers.dev/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ site: GATE_STORE, email: email })
          });
          try { localStorage.setItem('h8391001-gate-email', email.toLowerCase()); } catch(e) {}
          status.textContent = '✅ 已送出申請！管理員一撳批准，你重新整理此頁即可進入。';
        } catch (e) { status.textContent = '❌ 送出失敗 — 請直接 email ' + GATE_ADMIN_EMAIL; }
      }
      document.getElementById('gate-submit').addEventListener('click', submitGateRequest);
      input.addEventListener('keydown', function(ev) { if (ev.key === 'Enter') submitGateRequest(); });
    }
    initGate();
    </script>
</body>
</html>
